name: Workflow run retention

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sokhan-workflow-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test retention policy
        run: node --test .github/scripts/retention.test.mjs
      - name: Retain latest 30 completed runs per workflow
        uses: actions/github-script@v7
        with:
          script: |
            const { selectRunsToDelete } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/retention.mjs`
            );
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const deletions = selectRunsToDelete(runs, 30);
            core.info(`Found ${runs.length} runs; deleting ${deletions.length} completed runs older than the newest 30 per workflow.`);
            for (const run of deletions) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info(`Deleted workflow_id=${run.workflow_id}, run_id=${run.id}`);
            }
